spring:
  datasource:
    url: jdbc:h2:mem:explore-iam-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9100

app:
  demo-user:
    enabled: true
  oidc:
    seed-clients:
      - client-id: explore-ai
        client-name: Explore AI
        client-secret: explore-ai-dev-secret
        redirect-uris:
          - http://localhost:4200/login/oauth2/code/explore-iam
          - http://localhost:9000/login/oauth2/code/explore-iam
        post-logout-redirect-uris:
          - http://localhost:4200/
          - http://localhost:9000/
        scopes:
          - openid
          - profile
          - email
